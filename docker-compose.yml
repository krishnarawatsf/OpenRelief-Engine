services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: openrelief
      POSTGRES_USER: openrelief
      POSTGRES_PASSWORD: openrelief
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/app/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

volumes:
  postgres_data:
